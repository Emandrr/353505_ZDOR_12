<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление покупкой</title>
</head>
<body>
    <div class="container">
        <h1>Управление покупкой автомобиля</h1>

        <h2>{{ car.make }} {{ car.model }} ({{ car.year }})</h2>
        {% if car.photo %}
            <img src="{{ car.photo.url }}" alt="{{ car.make }} {{ car.model }}">
        {% endif %}
        <p>Цена: {{ car.price }} ₽</p>

        <form method="post">
            {% csrf_token %}
            <label for="staff_email">Выберите нового сотрудника:</label>
            <select name="staff_email" id="staff_email">
                {% for staff in staff_users %}
                    <option value="{{ staff.email }}" {% if staff.email == current_email %}selected{% endif %}>
                        {{ staff.username }} ({{ staff.email }})
                    </option>
                {% endfor %}
            </select>
            <br><br>
            <button type="submit" name="action" value="change_staff">Сменить сотрудника</button>
            <button type="submit" name="action" value="delete_car" onclick="return confirm('Удалить покупку?');">Удалить покупку</button>
        </form>

        <br>
        <a href="{% url 'my_purchased_cars' %}">← Назад к моим покупкам</a>
    </div>
</body>
</html>
