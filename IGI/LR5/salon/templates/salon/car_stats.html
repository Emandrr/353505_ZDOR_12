<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Статистика автомобилей</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        canvas {
            max-width: 800px;
            margin: 40px auto;
            display: block;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Статистика автомобилей</h1>
    <h3>Лучший менеджер: {{ top_manager }} ({{ top_manager_sales }} продаж)</h3>

    <canvas id="popularityChart"></canvas>
    <canvas id="priceChart"></canvas>
    <canvas id="correlationChart"></canvas>
    <canvas id="yearChart"></canvas>
    <canvas id="mileageChart"></canvas>
    <canvas id="managerSalesChart"></canvas>

    <script>

        new Chart(document.getElementById('popularityChart').getContext('2d'), {
            type: 'bar',
            data: {
                labels: {{ popular_labels|safe }},
                datasets: [{
                    label: 'Количество покупок',
                    data: {{ popular_values|safe }},
                    backgroundColor: 'rgba(75, 192, 192, 0.6)'
                }]
            }
        });

        new Chart(document.getElementById('priceChart').getContext('2d'), {
            type: 'bar',
            data: {
                labels: {{ expensive_labels|safe }},
                datasets: [{
                    label: 'Цена',
                    data: {{ expensive_prices|safe }},
                    backgroundColor: 'rgba(255, 99, 132, 0.6)'
                }]
            }
        });

        new Chart(document.getElementById('correlationChart').getContext('2d'), {
            type: 'scatter',
            data: {
                datasets: [{
                    label: 'Цена vs Популярность',
                    data: {{ correlation_data|safe }},
                    backgroundColor: 'rgba(54, 162, 235, 0.6)'
                }]
            },
            options: {
                scales: {
                    x: { title: { display: true, text: 'Цена (₽)' } },
                    y: { title: { display: true, text: 'Популярность' } }
                }
            }
        });

    new Chart(document.getElementById('yearChart').getContext('2d'), {
            type: 'pie',
            data: {
                labels: {{ year_labels|safe }},
                datasets: [{
                    label: 'Годы выпуска',
                    data: {{ year_values|safe }},
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.6)',
                        'rgba(54, 162, 235, 0.6)',
                        'rgba(255, 206, 86, 0.6)',
                        'rgba(75, 192, 192, 0.6)',
                        'rgba(153, 102, 255, 0.6)',
                        'rgba(255, 159, 64, 0.6)'
                    ]
                }]
            }
        });


        new Chart(document.getElementById('managerSalesChart').getContext('2d'), {
            type: 'pie',
            data: {
                labels: {{ manager_labels|safe }},
                datasets: [{
                    label: 'Продажи',
                    data: {{ manager_values|safe }},
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.6)',
                        'rgba(54, 162, 235, 0.6)',
                        'rgba(255, 206, 86, 0.6)',
                        'rgba(75, 192, 192, 0.6)',
                        'rgba(153, 102, 255, 0.6)',
                        'rgba(255, 159, 64, 0.6)',
                        'rgba(201, 203, 207, 0.6)'
                    ]
                }]
            }
        });

        new Chart(document.getElementById('mileageChart').getContext('2d'), {
            type: 'scatter',
            data: {
                datasets: [{
                    label: 'Пробег vs Популярность',
                    data: {{ mileage_data|safe }},
                    backgroundColor: 'rgba(255, 206, 86, 0.6)'
                }]
            },
            options: {
                scales: {
                    x: { title: { display: true, text: 'Пробег (км)' } },
                    y: { title: { display: true, text: 'Популярность' } }
                }
            }
        });


    </script>

    <div style="margin-top: 40px;">
        <a href="{% url 'homepage' %}">← Назад</a>
    </div>
</body>
</html>
