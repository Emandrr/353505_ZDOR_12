<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our vacancies</title>
</head>
<body>
<div class="vacancy-container">
    <h1>Вакансии</h1>
    {% for vacancy in vacancies %}
    <div class="vac-item">
        <h2>{{ vacancy.title }}</h2>
        <p class="vac-short">{{ vacancy.short_content }}</p>
        <p class="vac-full">{{ vacancy.full_content }}</p>
    </div>
    {% endfor %}
    <a href="{% url 'homepage' %}">← Назад</a>
</div>
</body>
